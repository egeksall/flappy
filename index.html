<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS / App Store Webview Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Angry Flappy">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0e17">
    
    <title>Angry Flappy - Flappy Bird + Angry Birds Hybrid</title>
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Phaser 3 (Bundled Offline Engine) -->
    <script src="phaser.min.js"></script>
</head>
<body>
    <div id="app-layout">
        <div class="ambient-glow"></div>

        <!-- Mobile / App Frame Wrapper -->
        <main id="game-wrapper">
            <div id="game-container"></div>
        </main>

        <!-- Desktop Showcase & Controls Guide Panel -->
        <aside id="desktop-companion">
            <header class="companion-header">
                <img src="assets/icon.png" alt="Angry Flappy App Icon">
                <div>
                    <h3>Angry Flappy</h3>
                    <p>Flappy Bird + Angry Birds</p>
                </div>
            </header>
            
            <div class="companion-badge">
                <span class="dot">●</span> Hybrid Mechanics v1.0
            </div>

            <div class="companion-section">
                <h4>Core Flow</h4>
                <ul class="feature-list">
                    <li><span class="icon">🏠</span> 1. Select Bird in Menu</li>
                    <li><span class="icon">🎯</span> 2. Pull Slingshot to Aim</li>
                    <li><span class="icon">🚀</span> 3. Release to Catapult</li>
                    <li><span class="icon">💨</span> 4. Slingshot Disappears</li>
                    <li><span class="icon">👆</span> 5. Tap / Spacebar to Flap</li>
                </ul>
            </div>

            <div class="companion-section">
                <h4>Playable Birds</h4>
                <ul class="feature-list">
                    <li><span class="icon">🔵</span> Blue Bird</li>
                    <li><span class="icon">🟡</span> Yellow Bird</li>
                    <li><span class="icon">⚫</span> Black Bird</li>
                </ul>
            </div>
        </aside>
    </div>

    <!-- Scripts -->
    <script src="js/audio.js?v=1.1"></script>
    <script src="js/game.js?v=1.1"></script>
</body>
</html>
